<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0f0d07"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5c518"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff1b8"/></marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="url(#bg)"/>
  <text x="500" y="38" text-anchor="middle" fill="#f7e7a8" font-size="20" font-weight="700">Kairo: one turn, three stages, one tool</text>

  <!-- prompt -->
  <rect x="30" y="215" width="130" height="90" rx="12" fill="#15120a" stroke="#4a3f1c"/>
  <text x="95" y="252" text-anchor="middle" fill="#f7e7a8" font-size="15" font-weight="600">User prompt</text>
  <text x="95" y="274" text-anchor="middle" fill="#b8a66c" font-size="12.5">"On Monday we</text>
  <text x="95" y="291" text-anchor="middle" fill="#b8a66c" font-size="12.5">shortlisted 5 CRMs…"</text>

  <!-- stage 1 -->
  <rect x="200" y="70" width="270" height="400" rx="14" fill="#14110a" stroke="#f5c518" stroke-width="1.5"/>
  <text x="335" y="98" text-anchor="middle" fill="#f5c518" font-size="13" font-weight="700" letter-spacing="1">STAGE 1 · PRE-FLIGHT</text>
  <text x="335" y="120" text-anchor="middle" fill="#f7e7a8" font-size="16" font-weight="650">Temporal &amp; episodic hydrator</text>
  <rect x="220" y="140" width="230" height="62" rx="9" fill="#1c180d" stroke="#4a3f1c"/>
  <text x="335" y="164" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">Temporal resolver</text>
  <text x="335" y="184" text-anchor="middle" fill="#b8a66c" font-size="12.5">Monday · last Tuesday · 3 Nov · since</text>
  <rect x="220" y="214" width="230" height="62" rx="9" fill="#1c180d" stroke="#4a3f1c"/>
  <text x="335" y="238" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">SQLite recall</text>
  <text x="335" y="258" text-anchor="middle" fill="#b8a66c" font-size="12.5">date_bucket index → FTS5 / BM25</text>
  <rect x="220" y="288" width="230" height="62" rx="9" fill="#1c180d" stroke="#4a3f1c"/>
  <text x="335" y="312" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">Fact snapshots</text>
  <text x="335" y="332" text-anchor="middle" fill="#b8a66c" font-size="12.5">what Kairo claimed, with source</text>
  <rect x="220" y="362" width="230" height="86" rx="9" fill="#2a2410" stroke="#f5c518"/>
  <text x="335" y="388" text-anchor="middle" fill="#ffe9a0" font-size="14" font-weight="600">&lt;episodic_memory&gt; block</text>
  <text x="335" y="408" text-anchor="middle" fill="#b8a66c" font-size="12.5">injected into the system prompt</text>
  <text x="335" y="428" text-anchor="middle" fill="#b8a66c" font-size="12.5">or &lt;no_match&gt; + dates that exist</text>

  <!-- stage 2 -->
  <rect x="520" y="70" width="270" height="400" rx="14" fill="#1a1810" stroke="#fff1b8" stroke-width="1.5"/>
  <text x="655" y="98" text-anchor="middle" fill="#fff1b8" font-size="13" font-weight="700" letter-spacing="1">STAGE 2 · AGENT LOOP</text>
  <text x="655" y="120" text-anchor="middle" fill="#f7e7a8" font-size="16" font-weight="650">LLM + single web_search tool</text>
  <rect x="540" y="140" width="230" height="56" rx="9" fill="#221f13" stroke="#4f4522"/>
  <text x="655" y="164" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">Streaming model turn</text>
  <text x="655" y="183" text-anchor="middle" fill="#b8a66c" font-size="12.5">⚡ starts with prefetched results</text>
  <rect x="540" y="208" width="230" height="62" rx="9" fill="#221f13" stroke="#4f4522"/>
  <text x="655" y="232" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">≤ 5 queries in parallel</text>
  <text x="655" y="252" text-anchor="middle" fill="#b8a66c" font-size="12.5">allSettled · 8 s timeout each</text>
  <rect x="540" y="282" width="230" height="62" rx="9" fill="#221f13" stroke="#4f4522"/>
  <text x="655" y="306" text-anchor="middle" fill="#f7e7a8" font-size="14" font-weight="600">Dedupe + rank</text>
  <text x="655" y="326" text-anchor="middle" fill="#b8a66c" font-size="12.5">official pages above listicles</text>
  <rect x="540" y="356" width="230" height="92" rx="9" fill="#221f13" stroke="#fff1b8"/>
  <text x="655" y="382" text-anchor="middle" fill="#fff7d6" font-size="14" font-weight="600">Deep-read ≤ 4 pricing pages</text>
  <text x="655" y="402" text-anchor="middle" fill="#b8a66c" font-size="12.5">HTML → compact Markdown</text>
  <text x="655" y="422" text-anchor="middle" fill="#b8a66c" font-size="12.5">tables and price lines kept</text>

  <!-- output -->
  <rect x="830" y="150" width="145" height="100" rx="12" fill="#15120a" stroke="#4a3f1c"/>
  <text x="902" y="186" text-anchor="middle" fill="#f7e7a8" font-size="15" font-weight="600">Answer</text>
  <text x="902" y="208" text-anchor="middle" fill="#b8a66c" font-size="12.5">streamed over SSE</text>
  <text x="902" y="227" text-anchor="middle" fill="#b8a66c" font-size="12.5">Then vs Now + links</text>

  <!-- stage 3 -->
  <rect x="800" y="330" width="185" height="140" rx="14" fill="#2b1f0c" stroke="#ff9f1c" stroke-width="1.5"/>
  <text x="892" y="356" text-anchor="middle" fill="#ff9f1c" font-size="13" font-weight="700" letter-spacing="1">STAGE 3 · ASYNC</text>
  <text x="892" y="380" text-anchor="middle" fill="#f7e7a8" font-size="15" font-weight="650">Fact extractor</text>
  <text x="892" y="402" text-anchor="middle" fill="#b8a66c" font-size="12.5">runs after `done`</text>
  <text x="892" y="421" text-anchor="middle" fill="#b8a66c" font-size="12.5">cheap model → rows</text>
  <text x="892" y="440" text-anchor="middle" fill="#b8a66c" font-size="12.5">zero user latency</text>

  <!-- arrows -->
  <path d="M160 260 H198" stroke="#f5c518" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M470 260 H518" stroke="#f5c518" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M790 200 H828" stroke="#fff1b8" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M902 250 V328" stroke="#ff9f1c" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <path d="M800 450 H600 Q580 450 580 490 H335 Q335 490 335 472" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <text x="590" y="512" text-anchor="middle" fill="#ff9f1c" font-size="12.5">new fact_snapshots feed tomorrow's recall</text>
  <text x="500" y="545" text-anchor="middle" fill="#8f7f4a" font-size="12.5">The model sees exactly one tool. Memory is resolved in-process before the first token is requested.</text>
</svg>
