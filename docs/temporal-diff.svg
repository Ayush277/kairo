  <text x="185" y="166" text-anchor="middle" fill="#ffe9a0" font-size="14" font-weight="700">MEMORY(t₀): SQLite</text>
  <text x="62" y="192" fill="#f7e7a8" font-size="13">Pipedrive · Advanced</text><text x="310" y="192" text-anchor="end" fill="#b8a66c" font-size="13">$24 / user</text>
  <text x="62" y="216" fill="#f7e7a8" font-size="13">Attio · Pro</text><text x="310" y="216" text-anchor="end" fill="#b8a66c" font-size="13">$59 / seat</text>
  <text x="62" y="240" fill="#f7e7a8" font-size="13">HubSpot · Professional</text><text x="310" y="240" text-anchor="end" fill="#b8a66c" font-size="13">$90 / seat</text>
  <text x="185" y="272" text-anchor="middle" fill="#8f7f4a" font-size="12">fact_snapshots, each with a source URL</text>

